# Day2 验收：PVC 持久化读回验证（Pod B）
# 在 day2-writer 完成写入并删除后运行：同一 PVC 重新挂载，读取 persist.txt 证明数据留存
apiVersion: v1
kind: Pod
metadata:
  name: day2-reader
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: reader
      image: busybox:1.36
      command: ["/bin/sh", "-c", "cat /mnt/data/persist.txt && echo READ_OK"]
      volumeMounts:
        - name: data
          mountPath: /mnt/data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: day2-pvc
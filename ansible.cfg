[defaults]
inventory = inventory/hosts.yml
interpreter_python = auto
host_key_checking = True
retry_files_enabled = False
roles_path = roles
# 不启用 fact caching：join token / certificate-key 只存在于内存与 hostvars，
# 禁止写入磁盘缓存（B0 安全基线）。
fact_caching = memory

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True

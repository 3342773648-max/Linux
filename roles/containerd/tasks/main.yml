# containerd role：安装 containerd 2.3 LTS + SystemdCgroup 配置
# 来源：B0 兼容矩阵（containerd.io/releases，查询日 2026-08-14）
# 安装方式：Docker 官方 apt 仓库（containerd.io 包，版本锁定）

- name: 添加 Docker 官方 GPG 密钥（containerd.io）
  ansible.builtin.shell: |
    set -e
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    chmod a+r /etc/apt/keyrings/docker.asc
  args:
    creates: /etc/apt/keyrings/docker.asc
  changed_when: true

- name: 添加 Docker 官方 apt 源（deb822 格式）
  ansible.builtin.deb822_repository:
    name: docker-stable
    types: [deb]
    uris: "{{ containerd_apt_repo | default('https://download.docker.com/linux/ubuntu') }}"
    suites: "{{ containerd_apt_suite | default('stable') }}"
    components: [stable]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: 安装 containerd.io（版本锁定：{{ containerd_version }}.*）
  ansible.builtin.apt:
    name: "containerd.io={{ containerd_version }}*"
    state: present
    update_cache: true
  register: containerd_install
  notify: restart containerd

- name: 生成默认配置（/etc/containerd/config.toml）
  ansible.builtin.shell: |
    set -e
    containerd config default | tee /etc/containerd/config.toml > /dev/null
  changed_when: false

- name: 设置 SystemdCgroup = true（containerd 2.x 路径）
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup\s*=\s*false'
    replace: 'SystemdCgroup = true'
  notify: restart containerd

- name: 锁定 containerd（防止非预期升级）
  ansible.builtin.dpkg_selections:
    selection: hold
    name: containerd.io

- name: 启用并启动 containerd
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: 验证 containerd 运行状态
  ansible.builtin.command: systemctl is-active containerd
  register: containerd_active
  changed_when: false

- name: 验证 containerd 版本
  ansible.builtin.command: containerd --version
  register: containerd_version_info
  changed_when: false

- name: 记录 containerd 状态
  ansible.builtin.debug:
    msg: "containerd={{ containerd_version_info.stdout }} active={{ containerd_active.stdout }}"
